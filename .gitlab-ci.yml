stages:
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: python:3.12-slim
  tags:
    - size/medium
    - type/docker
    - os/linux
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git

portable-kit-validation:
  stage: validate
  script:
    - python3 tools/run_tests.py
    - python3 tools/check_repository.py > ci-report.json
    - cat ci-report.json
    - python3 -m compileall -q tools tests
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-report.json
      - test-results.xml
    reports:
      junit: test-results.xml
